# Стартовые гипотезы, не подобранный оптимум.
mode: paper
symbol: BTCUSDT
category: linear
eth_enabled: false
state_db: data/state.db

queue_max: 256
stale_book_ms: 2000
stale_candle_ms: 90000
max_clock_skew_ms: 1500
max_requests_per_sec: 8

entry_timeout_sec: 3
max_hold_sec: 300
risk_pct: "0.001"
daily_loss_pct: "0.01"
max_consecutive_losses: 4
pause_after_losses_sec: 1800
max_leverage: "2"

ema_fast: 20
ema_slow: 50
rise_lookback_5m: 3
atr_period: 14
atr_min_pct: "0.00005"
atr_max_pct: "0.015"
pullback_atr_below: "0.50"
pullback_atr_above: "0.25"
stop_atr_buffer: "0.20"
reward_multiple: "1.5"
swing_max_age: 30
min_1m_bars: 320

max_spread_bps: "8"
min_depth_qty: "0.01"
depth_bps: "10"
slippage_bps: "1.0"
# В расчёте риска вход не считается гарантированным maker.
entry_fee_assumption: taker
maker_fee: "0.00020"
taker_fee: "0.00055"
trade_flow_enabled: false

# Offline/paper, если биржа не ответила ставками.
offline_equity: "10000"
tick_size: "0.1"
qty_step: "0.001"
min_qty: "0.001"
min_notional: "5"
train_ratio: "0.7"
